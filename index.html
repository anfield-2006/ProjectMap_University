<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="ArriveWise — จัดสรรเวลาให้คุณไปถึงเป้าหมายทันเวลา: คำนวณเวลาตื่น เวลาออกจากบ้าน และเผื่อเวลารถติด/อุบัติเหตุ">
  <title>ArriveWise — ไปถึงทันเวลา ทุกครั้ง</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/today" aria-label="ArriveWise หน้าแรก">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#050506" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.6-6-11a6 6 0 1 1 12 0c0 5.4-6 11-6 11z"/><path d="M12 7v3.2l2 1.3" stroke="#2f6bff"/></svg>
      </span>
      <span>Arrive<b>Wise</b></span>
    </a>
    <nav class="nav" aria-label="เมนูหลัก">
      <a href="#/today" data-nav="today">วันนี้</a>
      <a href="#/activities" data-nav="activities">กิจกรรม</a>
      <a href="#/add" data-nav="add">+ เพิ่มกิจกรรม</a>
      <a href="#/settings" data-nav="settings">ตั้งค่า</a>
    </nav>
    <span class="header-clock" id="headerClock" aria-live="off"></span>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="bottom-nav" aria-label="เมนูหลัก (มือถือ)">
    <a href="#/today" data-nav="today"><span class="ico">🏠</span>วันนี้</a>
    <a href="#/activities" data-nav="activities"><span class="ico">🗓️</span>กิจกรรม</a>
    <a href="#/add" data-nav="add"><span class="ico">➕</span>เพิ่ม</a>
    <a href="#/settings" data-nav="settings"><span class="ico">⚙️</span>ตั้งค่า</a>
  </nav>

  <div id="onboarding" class="onb hidden" role="dialog" aria-modal="true" aria-labelledby="onbTitle"></div>

  <dialog class="alarm" id="alarmDialog" aria-labelledby="alarmTitle">
    <div class="alarm-inner">
      <div class="alarm-ring" aria-hidden="true">⏰</div>
      <div class="alarm-time mono" id="alarmClock">--:--</div>
      <h2 id="alarmTitle" style="font-size:26px">ตื่นได้แล้ว!</h2>
      <p id="alarmText" class="muted" style="max-width:440px;margin:0"></p>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn btn-primary" id="alarmStop">ตื่นแล้ว ✓</button>
        <button class="btn" id="alarmSnooze">เลื่อน 5 นาที</button>
      </div>
      <p class="dim" id="alarmSnoozeNote" style="font-size:13px;margin:6px 0 0"></p>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/js/engine.js"></script>
  <script src="/js/nlp.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
